name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint (oxlint)
      run: npm run lint
      
    - name: Type check (tsc)
      run: npm run typecheck
      
    - name: Test (vitest)
      run: npm run test
      
    - name: Build (vite)
      run: npm run build
